<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>韓式波點風 ✧ 迷因產生器 MEME GENERATOR</title>

    <!-- 1. 引入 Google Fonts (Inter & Noto Sans TC) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

    <!-- 2. 引入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 3. 引入 html2canvas CDN (用於將 DOM 區塊轉為圖片下載) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- 4. 自訂 CSS 樣式 (韓式波點與 Neumorphism/Neubrutalism 黑白復古風) -->
    <style>
        :root {
            --bg-color: #f7f7f8;
            --dot-color: #d1d5db;
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            /* 韓式復古波點點陣背景 */
            background-image: radial-gradient(var(--dot-color) 1.5px, transparent 1.5px);
            background-size: 20px 20px;
            color: #111827;
        }

        /* Neubrutalism 硬邊陰影樣式 */
        .mono-card {
            background: #ffffff;
            border: 2.5px solid #000000;
            box-shadow: 6px 6px 0px #000000;
        }

        .mono-btn {
            background: #000000;
            color: #ffffff;
            border: 2px solid #000000;
            box-shadow: 4px 4px 0px #666666;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .mono-btn:hover {
            transform: translateY(-2px);
            box-shadow: 6px 6px 0px #000000;
            background-color: #111827;
        }

        .mono-btn:active {
            transform: translateY(2px);
            box-shadow: 1px 1px 0px #000000;
        }

        /* 迷因文字的黑色描邊效果 (確保任何背景圖片上都清晰可見) */
        .meme-text-stroke {
            color: #ffffff;
            text-shadow:
                3px 3px 0 #000,
               -3px 3px 0 #000,
                3px -3px 0 #000,
               -3px -3px 0 #000,
                0px 3px 0 #000,
                0px -3px 0 #000,
                3px 0px 0 #000,
               -3px 0px 0 #000,
                2px 2px 5px rgba(0,0,0,0.8);
            word-break: break-word;
            line-height: 1.2;
        }

        /* 自訂 Range 滑桿樣式 (黑白極簡) */
        input[type=range] {
            -webkit-appearance: none;
            background: #e5e7eb;
            height: 8px;
            border-radius: 4px;
            border: 1px solid #000000;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #000000;
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="min-h-screen py-8 px-4 flex flex-col items-center justify-between">

    <!-- 頁頭 Header -->
    <header class="w-full max-w-5xl text-center mb-8">
        <div class="inline-block bg-black text-white px-4 py-1 rounded-full text-xs font-bold tracking-widest mb-2 shadow-sm">
            ✦ KOREAN MONOCHROME STYLE ✦
        </div>
        <h1 class="text-3xl sm:text-4xl font-black tracking-tight flex items-center justify-center gap-2">
            <span>MEME MAKER</span>
            <span class="text-xl">˚.♡</span>
        </h1>
        <p class="text-xs sm:text-sm text-gray-600 mt-1">自定義迷因產生器 𖦹 快來製作你的爆笑迷因吧！</p>
    </header>

    <!-- 主內容區：左右分欄（電腦端），上下分欄（手機端） -->
    <main class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <!-- 左側：控制面板 Control Panel (佔 5 欄) -->
        <section class="lg:col-span-5 mono-card rounded-3xl p-6 flex flex-col gap-5">
            <h2 class="text-lg font-black tracking-wide border-b-2 border-black pb-3 flex items-center justify-between">
                <span>⚙️ 控制面板</span>
                <span class="text-xs bg-gray-100 text-gray-700 px-2 py-0.5 rounded-md border border-black">SETTINGS</span>
            </h2>

            <!-- 1. 上傳圖片區 -->
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-bold uppercase tracking-wider text-gray-700">1. 上傳底圖 (Local File)</label>
                <label for="image-upload" class="cursor-pointer border-2 border-dashed border-gray-400 hover:border-black rounded-2xl p-4 text-center bg-gray-50 hover:bg-gray-100 transition-all flex flex-col items-center justify-center gap-1 group">
                    <span class="text-2xl group-hover:scale-110 transition-transform">🖼️</span>
                    <span class="text-xs font-bold text-gray-700">點擊選擇照片或拖曳至此</span>
                    <span class="text-[10px] text-gray-400">支援 JPG, PNG, WEBP (完全本地讀取，免 CORS)</span>
                </label>
                <!-- 隱藏的原始 file input -->
                <input type="file" id="image-upload" accept="image/*" class="hidden">
            </div>

            <!-- 2. 文字輸入區 -->
            <div class="flex flex-col gap-3">
                <div>
                    <label for="top-text-input" class="text-xs font-bold uppercase tracking-wider text-gray-700 block mb-1">2. 上方文字 (Top Text)</label>
                    <input type="text" id="top-text-input" placeholder="請輸入上方文字..." value="小拳拳" 
                        class="w-full px-3 py-2 border-2 border-black rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-black">
                </div>
                <div>
                    <label for="bottom-text-input" class="text-xs font-bold uppercase tracking-wider text-gray-700 block mb-1">3. 下方文字 (Bottom Text)</label>
                    <input type="text" id="bottom-text-input" placeholder="請輸入下方文字..." value="捶你喔" 
                        class="w-full px-3 py-2 border-2 border-black rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-black">
                </div>
            </div>

            <!-- 3. 滑桿微調區 -->
            <div class="flex flex-col gap-4 border-t border-gray-200 pt-4">
                <!-- 字體大小 -->
                <div>
                    <div class="flex justify-between text-xs font-bold mb-1">
                        <span>字體大小 (Font Size)</span>
                        <span id="font-size-val">36px</span>
                    </div>
                    <input type="range" id="font-size-slider" min="16" max="72" value="36" class="w-full">
                </div>

                <!-- 上方文字垂直位置 -->
                <div>
                    <div class="flex justify-between text-xs font-bold mb-1">
                        <span>上方文字高低 (Top Pos)</span>
                        <span id="top-pos-val">16px</span>
                    </div>
                    <input type="range" id="top-pos-slider" min="0" max="150" value="16" class="w-full">
                </div>

                <!-- 下方文字垂直位置 -->
                <div>
                    <div class="flex justify-between text-xs font-bold mb-1">
                        <span>下方文字高低 (Bottom Pos)</span>
                        <span id="bottom-pos-val">16px</span>
                    </div>
                    <input type="range" id="bottom-pos-slider" min="0" max="150" value="16" class="w-full">
                </div>
            </div>

            <!-- 4. 下載按鈕 -->
            <button id="download-btn" class="mono-btn rounded-2xl py-3.5 px-6 font-black text-sm tracking-wider flex items-center justify-center gap-2 mt-2">
                <span>✦ 下載迷因圖檔 (PNG) ✦</span>
            </button>
        </section>

        <!-- 右側：預覽區 Preview Area (佔 7 欄) -->
        <section class="lg:col-span-7 flex flex-col items-center justify-center w-full">
            <div class="w-full flex items-center justify-between mb-2 px-1">
                <span class="text-xs font-bold tracking-wider text-gray-700">✦ LIVE PREVIEW</span>
                <span class="text-[11px] font-mono text-gray-500">HTML2CANVAS READY</span>
            </div>

            <!-- 迷因畫布外框（html2canvas 截圖目標區域） -->
            <div id="meme-canvas-container" class="mono-card rounded-3xl overflow-hidden relative w-full flex items-center justify-center bg-gray-900 select-none min-h-[320px] max-h-[600px]">
                
                <!-- 預設底圖（可被使用者上傳替換） -->
                <img id="meme-image" src="https://images.unsplash.com/photo-1533738363-b7f9aef128ce?q=80&w=800&auto=format&fit=crop" 
                     alt="Meme Background" 
                     class="w-full h-auto max-h-[580px] object-contain block mx-auto">

                <!-- 迷因上方文字 -->
                <div id="meme-top-text" class="absolute top-4 left-0 w-full px-6 text-center font-black uppercase tracking-wider meme-text-stroke text-3xl pointer-events-none">
                    小拳拳
                </div>

                <!-- 迷因下方文字 -->
                <div id="meme-bottom-text" class="absolute bottom-4 left-0 w-full px-6 text-center font-black uppercase tracking-wider meme-text-stroke text-3xl pointer-events-none">
                    捶你喔
                </div>
            </div>
        </section>

    </main>

    <!-- 頁尾 Footer -->
    <footer class="mt-12 text-center text-xs text-gray-500 tracking-widest">
        <p>MADE WITH ♡ ✦ ⋆ | KOREAN MONOCHROME POLKA DOT STYLE</p>
    </footer>

    <!-- 5. JavaScript 邏輯控制區 -->
    <script>
        // --- 取得 HTML DOM 元素引用 ---
        const imageUploadInput = document.getElementById('image-upload');
        const memeImage = document.getElementById('meme-image');
        
        const topTextInput = document.getElementById('top-text-input');
        const bottomTextInput = document.getElementById('bottom-text-input');
        
        const memeTopText = document.getElementById('meme-top-text');
        const memeBottomText = document.getElementById('meme-bottom-text');
        
        const fontSizeSlider = document.getElementById('font-size-slider');
        const fontSizeVal = document.getElementById('font-size-val');
        
        const topPosSlider = document.getElementById('top-pos-slider');
        const topPosVal = document.getElementById('top-pos-val');
        
        const bottomPosSlider = document.getElementById('bottom-pos-slider');
        const bottomPosVal = document.getElementById('bottom-pos-val');
        
        const downloadBtn = document.getElementById('download-btn');
        const memeContainer = document.getElementById('meme-canvas-container');

        // --- 功能 1：本機圖片上傳 (使用 FileReader 防範 CORS 跨域錯誤) ---
        imageUploadInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                // 建立 FileReader 物件讀取本機檔案
                const reader = new FileReader();
                reader.onload = function(event) {
                    // 將讀取出來的 DataURL 直接賦予給 <img> 的 src 屬性
                    memeImage.src = event.target.result;
                };
                reader.readAsDataURL(file); // 開始讀取圖片檔案
            }
        });

        // --- 功能 2：文字即時同步更新 ---
        topTextInput.addEventListener('input', function() {
            // 當輸入框內容改變時，同步更新畫布上的文字；若為空則顯示預設預覽
            memeTopText.textContent = this.value || '';
        });

        bottomTextInput.addEventListener('input', function() {
            memeBottomText.textContent = this.value || '';
        });

        // --- 功能 3：字體大小滑桿控制 ---
        fontSizeSlider.addEventListener('input', function() {
            const size = this.value + 'px';
            memeTopText.style.fontSize = size;
            memeBottomText.style.fontSize = size;
            fontSizeVal.textContent = size; // 更新顯示數值
        });

        // --- 功能 4：垂直位置滑桿控制 ---
        topPosSlider.addEventListener('input', function() {
            const pos = this.value + 'px';
            memeTopText.style.top = pos;
            topPosVal.textContent = pos;
        });

        bottomPosSlider.addEventListener('input', function() {
            const pos = this.value + 'px';
            memeBottomText.style.bottom = pos;
            bottomPosVal.textContent = pos;
        });

        // --- 功能 5：一鍵截圖下載圖檔 (html2canvas 實作) ---
        downloadBtn.addEventListener('click', function() {
            // 改變按鈕狀態告知使用者正在處理中
            const originalBtnText = downloadBtn.innerHTML;
            downloadBtn.innerHTML = '<span>⏳ 產生圖檔中...</span>';
            downloadBtn.disabled = true;

            // 使用 html2canvas 將截圖區域轉成 HTML5 Canvas
            html2canvas(memeContainer, {
                useCORS: true,       // 允許跨域圖片 (若使用遠端圖片時)
                scale: 2,            // 提高渲染倍率 (輸出更清晰高畫質的圖檔)
                backgroundColor: null // 保持背景設定
            }).then(canvas => {
                // 將 Canvas 轉成 PNG Data URL
                const imageUrl = canvas.toDataURL('image/png');
                
                // 動態建立 <a> 標籤進行隱形點擊下載
                const link = document.createElement('a');
                link.download = 'my-meme.png';
                link.href = imageUrl;
                link.click(); // 觸發下載

                // 恢復按鈕狀態
                downloadBtn.innerHTML = originalBtnText;
                downloadBtn.disabled = false;
            }).catch(err => {
                console.error('截圖失敗:', err);
                alert('下載失敗，請重新嘗試！');
                downloadBtn.innerHTML = originalBtnText;
                downloadBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
